# 개발용 오버라이드 — 프론트를 vite dev 서버로 교체해 코드 수정을 즉시 반영한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 기본(docker-compose.yml)의 frontend 는 nginx 정적 빌드라 코드 변경 시 재빌드가
# 필요하다. 이 오버라이드는 ./frontend 소스를 컨테이너에 마운트하고 HMR 을 켠다.
# node_modules 는 익명 볼륨으로 가려 호스트(예: macOS)와 컨테이너(linux)의
# 네이티브 바이너리가 충돌하지 않게 한다 — 이미지 빌드 시 npm ci 로 채워진
# 리눅스용 node_modules 가 그대로 쓰인다.

services:
  frontend:
    # 기본(nginx) 이미지와 태그가 겹치지 않게 별도 이름을 준다 — 두 모드를
    # 오가며 --build 없이 up 해도 서로의 이미지를 덮어쓰지 않는다.
    image: vlverifier-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VLVERIFIER_API_TARGET: http://backend:8000
    # 기본 파일의 "5173:80" 을 대체 (nginx:80 대신 vite:5173).
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
