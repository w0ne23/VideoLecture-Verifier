services:
  backend:
    shm_size: "${VERILEC_SHM_SIZE:-64g}"
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
        INSTALL_TENSORRT: "1"
    environment:
      NVIDIA_VISIBLE_DEVICES: "${VERILEC_NVIDIA_DEVICE:-1}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
      GRAPHLEC_SLIDE_DECODE_BACKEND: ffmpeg-cuda
      GRAPHLEC_SLIDE_OCR_PROVIDER: http
      GRAPHLEC_SLIDE_OCR_BASE_URL: http://ocr:8000
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ENGINE: "/app/storage/models/yolo26n-fp16.engine"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_TRT_CONTEXTS: "2"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_GPU_SERIALIZE: "0"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_WORKERS: "4"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_WORKERS: "12"
      GRAPHLEC_SAMPLE_CACHE_MERGE_WORKERS: "8"
      GRAPHLEC_SAMPLE_CACHE_MERGE_MASK_WORKERS: "12"
      GRAPHLEC_REGION_WORKERS: "12"
      GRAPHLEC_SCENE_PROBE_WORKERS: "12"
      GRAPHLEC_DUPLICATE_WORKERS: "100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VERILEC_NVIDIA_DEVICE:-1}"]
              capabilities: [gpu]

  ocr:
    environment:
      NVIDIA_VISIBLE_DEVICES: "${VERILEC_NVIDIA_DEVICE:-1}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VERILEC_NVIDIA_DEVICE:-1}"]
              capabilities: [gpu]

  ollama:
    environment:
      NVIDIA_VISIBLE_DEVICES: "${VERILEC_NVIDIA_DEVICE:-1}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VERILEC_NVIDIA_DEVICE:-1}"]
              capabilities: [gpu]
