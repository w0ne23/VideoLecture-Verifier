# Central LiteLLM router for the verifier pipeline.
# The model_name values intentionally match the identifiers emitted by the web
# model registry and the legacy stage environment variables.  The backend can
# therefore keep its existing model selection contract while all ordinary
# verifier calls use one OpenAI-compatible gateway.

model_list:
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

