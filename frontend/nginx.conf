# VLVerifier 프론트엔드 서빙 설정
#
# 정적 SPA 서빙 + 프론트가 상대경로로 호출하는 /api·/files 를 backend 컨테이너로 전달
# 프론트 코드에 백엔드 주소가 하드코딩되어 있지 않으므로(모두 상대경로) 이 프록시만으로 동작

upstream vlverifier_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 API — 프론트는 `/api/lectures` 처럼 호출하고, 백엔드 라우트에는
    # `/api` 프리픽스가 없으므로 벗겨서 전달 (vite dev 프록시와 동일 규칙)
    location /api/ {
        proxy_pass http://vlverifier_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # job 진행 상황은 SSE(text/event-stream)로 내려오므로 버퍼링 끄고 커넥션 장기 유지
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # 업로드 영상 / 슬라이드 이미지 등 정적 산출물 (프리픽스 유지)
    location /files/ {
        proxy_pass http://vlverifier_backend/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 업로드 용량 상한 (영상 파일)
    client_max_body_size 2g;

    # SPA 라우팅 — 실제 파일이 없으면 index.html 로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 자산은 내용이 바뀌면 파일명도 바뀌므로 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
