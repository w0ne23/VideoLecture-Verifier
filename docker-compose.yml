# VLVerifier 배포 기본 스택 — docker compose up 하나로 전체 서비스 기동
# 개발 중 코드 즉시 반영은 docker-compose.dev.yml, GPU 가속은 docker-compose.gpu.yml 을
# 오버라이드로 함께 지정
#
# 프로파일: ocr(별도 OCR 서비스), vlm(로컬 Ollama)

services:
  # PostgreSQL 16 — 애플리케이션 DB(verilec)와 LiteLLM 게이트웨이 DB(litellm)를
  # 한 컨테이너에서 논리적으로 분리
  db:
    image: postgres:16
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      POSTGRES_DB: verilec
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # backend 의 depends_on(service_healthy)이 이 체크 통과까지 대기
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d verilec"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI API 서버 + 검증 파이프라인 실행 워커
  # 업로드 수신, 전처리, Multi-LLM 검증, 결과 조회 담당
  backend:
    # 2 GiB 는 Docker Desktop·소형 머신 기준
    # 대형 리눅스 호스트는 VLVERIFIER_SHM_SIZE 또는 GPU 오버라이드로 상향
    shm_size: "${VLVERIFIER_SHM_SIZE:-2g}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 네이티브 세그폴트(numba/torch 등) 시 코어 덤프가 ./backend 에 수십 GB 쌓이는 것 방지
    # (core.<pid> 파일 자체를 생성 안 함)
    ulimits:
      core: 0

    env_file:
      - .env

    environment:
      # 기본 인프라 연결
      DATABASE_URL: postgresql+asyncpg://user:pass@db/verilec
      LOCAL_STORAGE_DIR: /app/storage
      PIPELINE_ROOT: /app

      # 슬라이드 OCR — 기본은 CPU RapidOCR HTTP 호출
      # GPU 오버라이드가 HTTP OCR 계약 유지한 채 Nemotron OCR v2 로 전환
      VLVERIFIER_SLIDE_OCR_PROVIDER: http
      VLVERIFIER_SLIDE_OCR_BASE_URL: http://127.0.0.1:8000
      VLVERIFIER_SLIDE_OCR_LANG: korean
      VLVERIFIER_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.83"
      VLVERIFIER_SLIDE_OCR_ADJACENT_SIMILARITY_THRESHOLD: "0.83"

      # LocalVLM — 슬라이드 후보 검토는 VLVerifier 직접 제공 전처리라 외부 API 대신 로컬 LLM(Ollama) 사용
      # 상용 API 버전:
      #   VLVERIFIER_VLM_PROVIDER: "openai"
      #   VLVERIFIER_OPENAI_BASE_URL: "https://api.openai.com/v1"
      #   VLVERIFIER_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      #   VLVERIFIER_OPENAI_MODEL: "gpt-5.6-luna"
      VLVERIFIER_VLM_ENABLED: "${VLVERIFIER_VLM_ENABLED:-1}"
      VLVERIFIER_VLM_APPLY: "${VLVERIFIER_VLM_APPLY:-1}"
      VLVERIFIER_VLM_PROVIDER: "${VLVERIFIER_VLM_PROVIDER:-ollama}"
      VLVERIFIER_OLLAMA_BASE_URL: "${VLVERIFIER_OLLAMA_BASE_URL:-http://ollama:11434}"
      VLVERIFIER_OLLAMA_MODEL: "${VLVERIFIER_OLLAMA_MODEL:-gemma4:12b}"
      VLVERIFIER_VLM_WORKERS: "15"
      VLVERIFIER_VLM_BATCH_IMAGES: "2"
      VLVERIFIER_VLM_BATCH_CANDIDATES: "1"
      VLVERIFIER_VLM_TIMELINE_CONTEXT_IMAGES: "0"
      VLVERIFIER_VLM_TIMEOUT_SEC: "300"
      VLVERIFIER_VLM_NUM_PREDICT: "512"
      VLVERIFIER_VLM_IMAGE_WIDTH: "768"

      # P2A base 슬라이드 t1/t1_structure 추출 — 정확도 우선이라 로컬 qwen3-vl:30b 사용
      # gpt-5.4-mini 로 되돌리려면 provider 만 openai 로 변경
      VLVERIFIER_SLIDE_TEXTUALIZER_PROVIDER: "${VLVERIFIER_SLIDE_TEXTUALIZER_PROVIDER:-ollama}"
      VLVERIFIER_SLIDE_TEXTUALIZER_MODEL: "${VLVERIFIER_SLIDE_TEXTUALIZER_MODEL:-qwen3-vl:30b}"
      VLVERIFIER_SLIDE_TEXTUALIZER_WORKERS: "12"

      # 검증 단계 동시성 — Multi-LLM 단계는 모델별 적용, claim 추출·슬라이드 검사는 단계 워커 상한
      # 호스트 환경변수로 기본값 재정의 가능
      VERIFIER_STAGE_MAX_WORKERS: "${VERIFIER_STAGE_MAX_WORKERS:-12}"
      VERIFIER_CLAIM_EXTRACT_MAX_WORKERS: "${VERIFIER_CLAIM_EXTRACT_MAX_WORKERS:-20}"
      ISSUE_JUDGE_MAX_WORKERS: "${ISSUE_JUDGE_MAX_WORKERS:-20}"
      ISSUE_TYPE_CLASSIFIER_MAX_WORKERS: "${ISSUE_TYPE_CLASSIFIER_MAX_WORKERS:-20}"
      CLASSIFIED_ISSUE_VERIFIER_MAX_WORKERS: "${CLASSIFIED_ISSUE_VERIFIER_MAX_WORKERS:-20}"
      CLASSIFIED_ISSUE_GROUNDING_MAX_WORKERS: "${CLASSIFIED_ISSUE_GROUNDING_MAX_WORKERS:-20}"
      CLASSIFIED_SLIDE_ERROR_MAX_WORKERS: "${CLASSIFIED_SLIDE_ERROR_MAX_WORKERS:-20}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-qwen3.8-27b}"
      LOCAL_LLM_ENABLE_THINKING: "${LOCAL_LLM_ENABLE_THINKING:-0}"

      # UI 에서 선택한 검증 모델은 모두 LiteLLM 게이트웨이 경유
      LITELLM_ENABLED: "${LITELLM_ENABLED:-1}"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-http://litellm:4000/v1}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}}"
      VLVERIFIER_CREDENTIAL_ENCRYPTION_KEY: "${VLVERIFIER_CREDENTIAL_ENCRYPTION_KEY:-${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}}"

      # 슬라이드 디코드 백엔드 — Docker Desktop(macOS)은 VideoToolbox/CUDA 를 리눅스 컨테이너에 노출 못 해 기본 auto
      # GPU 오버라이드가 CUDA 활성화
      VLVERIFIER_SLIDE_DECODE_BACKEND: auto
      VLVERIFIER_GPU_ONLY: "0"
      # Step 4 중복/빌드 비교 크롭 — 각 가장자리 5% 제거
      VLVERIFIER_CONTENT_CROP_LEFT: "0.05"
      VLVERIFIER_CONTENT_CROP_TOP: "0.05"
      VLVERIFIER_CONTENT_CROP_RIGHT: "0.95"
      VLVERIFIER_CONTENT_CROP_BOTTOM: "0.95"
      VLVERIFIER_CLEAR_RESET_CROP_BOTTOM: "0.90"

      # Ultralytics/matplotlib 가 홈 디렉터리 쓰기를 시도하며 내는 경고 방지
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
      RAPIDOCR_HOME: /models

      # Step 0 sample cache 청크 병렬화
      VLVERIFIER_SAMPLE_CACHE_FPS: "2"
      VLVERIFIER_SAMPLE_CACHE_RESIZE_WIDTH: "768"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASKS: "1"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_MODEL: "/app/models/yolo26n.pt"
      # TensorRT 엔진(리눅스 호스트 복사본)이 CPU 전용 머신에서 선택되는 것 방지 — 빈 값이면 Ultralytics 가 .pt 로드
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_ENGINE: ""
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_BATCH_SIZE: "32"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_ENGINE_BATCH_SIZE: "32"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_CONF: "0.70"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_MIN_BBOX_HEIGHT_RATIO: "0.08"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_MAX_BBOX_ASPECT: "1.50"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_DILATE_PX: "48"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_CENTER_SHIFT_PX: "4"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_AREA_CHANGE_RATIO: "0.08"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_FILL_GAP_SEC: "0"
      # 1.4GB TensorRT 실행 컨텍스트 2개만 상주 — 나머지 디코드 청크는 슬롯이 빌 때까지 person 배치 대기
      VLVERIFIER_SAMPLE_CACHE_PERSON_GATE_INTERVAL_SEC: "20"
      VLVERIFIER_SAMPLE_CACHE_PERSON_GATE_MIN_HITS: "1"
      VLVERIFIER_SAMPLE_CACHE_PERSON_GATE_CONF: "0.45"
      VLVERIFIER_SCENE_BASE_DELAY_SEC: "2.0"
      VLVERIFIER_SCENE_BASE_MAX_PENDING_SEC: "5.0"
      # 최대 3초만 노출되는 슬라이드 제거 — 남은 타임라인은 OCR/VLM 전 압축돼 A→순간슬라이드→A 복귀를 연속 슬라이드로 평가
      VLVERIFIER_MIN_SLIDE_DURATION_SEC: "3.0"
      VLVERIFIER_SAMPLE_CACHE_PERSON_GATE_WIDTH: "384"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_WORKERS: "1"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_TASK_SEC: "480"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_TASK_OVERLAP_SEC: "5"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_ROI_QUANTILE: "0.95"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_ROI_RECENTER_PX: "120"
      VLVERIFIER_SAMPLE_CACHE_PERSON_MASK_ROI_MAX_GAP_SEC: "2"
      VLVERIFIER_SAMPLE_CACHE_CHUNK_WORKERS: "4"
      VLVERIFIER_SAMPLE_CACHE_CHUNK_SEC: "240"
      VLVERIFIER_SAMPLE_CACHE_CHUNK_OVERLAP_SEC: "5"
      VLVERIFIER_SAMPLE_CACHE_MERGE_WORKERS: "4"
      VLVERIFIER_SAMPLE_CACHE_MERGE_MASK_WORKERS: "4"

      # Step 1 타임라인 영역 분류 병렬화
      VLVERIFIER_REGION_WORKERS: "4"
      VLVERIFIER_REGION_CHUNK_SAMPLES: "2000"
      VLVERIFIER_REGION_GUARD_SAMPLES: "1"

      # Step 2 scene/base probe 병렬화
      VLVERIFIER_SCENE_PROBE_WORKERS: "4"
      VLVERIFIER_SCENE_PROBE_CHUNK_SAMPLES: "2000"
      VLVERIFIER_SCENE_PROBE_GUARD_SAMPLES: "100"
      VLVERIFIER_SCENE_PROBE_KEEP_PARTS: "0"

      # Step 4 중복 슬라이드 판정 병렬화
      VLVERIFIER_DUPLICATE_PARALLEL: "1"
      VLVERIFIER_DUPLICATE_WORKERS: "4"
      VLVERIFIER_DUPLICATE_LOG_PAIRS: "0"

    volumes:
      - ./storage:/app/storage
      - ./input:/app/input
      - rapid_ocr_models:/models

    ports:
      - "8003:8000"

    depends_on:
      db:
        condition: service_healthy

  # 정적 빌드 SPA 를 nginx 로 서빙, /api·/files 를 backend 로 프록시
  # 코드 즉시 반영이 필요하면 docker-compose.dev.yml 병행
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 슬라이드 OCR 마이크로서비스 — ocr 프로파일 지정 시에만 기동
  # backend 의 VLVERIFIER_SLIDE_OCR_BASE_URL 이 이 서비스를 가리키면 OCR 부하 분리 (주로 GPU 오버라이드)
  ocr:
    profiles:
      - ocr
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      LOCAL_STORAGE_DIR: /app/storage
      VLVERIFIER_SLIDE_OCR_LANG: multilingual
      VLVERIFIER_SLIDE_OCR_MODEL_DIR: ""
      VLVERIFIER_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.92"
    volumes:
      - ./storage:/app/storage
    ports:
      - "8010:8000"

  # 로컬 LLM 런타임 — vlm 프로파일 지정 시에만 기동
  # LocalVLM(슬라이드 검토)·slide textualizer 가 호출
  ollama:
    profiles:
      - vlm
    image: ollama/ollama:latest
    container_name: vlverifier-ollama
    environment:
      # 모델 기본 컨텍스트(Qwen3 계열 262144) 그대로 로드하면 KV 캐시만으로 GPU 가 차 연산이 CPU 로 밀림
      # (실제로 겪은 문제라 명시적으로 하향)
      OLLAMA_CONTEXT_LENGTH: "${VLVERIFIER_OLLAMA_CONTEXT_LENGTH:-16384}"
      OLLAMA_NUM_PARALLEL: "${VLVERIFIER_OLLAMA_NUM_PARALLEL:-4}"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # OpenAI 호환 게이트웨이 — UI 에서 선택한 검증 모델을 provider 별 라우팅
  # 기존 PostgreSQL 컨테이너 안 별도 논리 DB(litellm) 사용 → 게이트웨이 스키마가 애플리케이션 DB(verilec)를 건드릴 수 없음
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.98.0
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}"
      # LiteLLM 은 프록시 관리용 DB 연결에 DATABASE_URL 사용 — backend 의 PostgreSQL 서비스 재사용
      DATABASE_URL: "${LITELLM_DATABASE_URL:-postgresql://user:pass@db/litellm}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      GOOGLE_API_KEY_1: "${GOOGLE_API_KEY_1:-${GOOGLE_API_KEY:-}}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-${VLLM_API_KEY:-local}}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-${VLLM_BASE_URL:-}}"
      VLLM_API_KEY: "${VLLM_API_KEY:-local}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

# 컨테이너 재생성과 무관하게 유지되는 영속 볼륨
volumes:
  ollama:            # Ollama 가 받아둔 모델 가중치
  postgres_data:     # PostgreSQL 데이터 디렉터리
  rapid_ocr_models:  # RapidOCR 모델 캐시
