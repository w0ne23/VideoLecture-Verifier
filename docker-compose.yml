services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: verilec
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db/verilec
      LOCAL_STORAGE_DIR: /app/storage
      PIPELINE_ROOT: /app
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
