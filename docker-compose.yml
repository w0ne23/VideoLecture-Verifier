services:
  db:
    image: postgres:16
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      POSTGRES_DB: verilec
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      # LocalVLM / OpenAI-compatible DiffusionGemma

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d verilec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 2 GiB works with Docker Desktop and small machines.  Large Linux hosts
    # can raise this through VLVERIFIER_SHM_SIZE or the GPU override.
    shm_size: "${VLVERIFIER_SHM_SIZE:-2g}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db/verilec
      LOCAL_STORAGE_DIR: /app/storage
      PIPELINE_ROOT: /app
      # Portable default: CPU RapidOCR. The NVIDIA override switches this to
      # Nemotron OCR v2 without changing the pipeline's HTTP OCR contract.
      GRAPHLEC_SLIDE_OCR_PROVIDER: http
      GRAPHLEC_SLIDE_OCR_BASE_URL: http://127.0.0.1:8000
      GRAPHLEC_SLIDE_OCR_LANG: korean
      GRAPHLEC_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.83"
      GRAPHLEC_SLIDE_OCR_ADJACENT_SIMILARITY_THRESHOLD: "0.83"
      # LocalVLM은 provider 설정에 따라 Ollama 또는 LiteLLM(OpenAI 호환)을 사용한다.
      GRAPHLEC_VLM_ENABLED: "1"
      GRAPHLEC_VLM_APPLY: "1"
      GRAPHLEC_VLM_PROVIDER: "${VLVERIFIER_VLM_PROVIDER:-ollama}"
      GRAPHLEC_OLLAMA_BASE_URL: "http://ollama:11434"
      GRAPHLEC_OLLAMA_MODEL: "${VLVERIFIER_VLM_MODEL:-gemma4:12b}"
      GRAPHLEC_OPENAI_BASE_URL: "${GRAPHLEC_OPENAI_BASE_URL:-http://litellm:4000/v1}"
      GRAPHLEC_OPENAI_API_KEY: "${GRAPHLEC_OPENAI_API_KEY:-${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}}"
      GRAPHLEC_OPENAI_MODEL: "${GRAPHLEC_OPENAI_MODEL:-gpt-5.6-luna}"
      GRAPHLEC_VLM_WORKERS: "15"
      GRAPHLEC_VLM_BATCH_IMAGES: "2"
      GRAPHLEC_VLM_BATCH_CANDIDATES: "1"
      GRAPHLEC_VLM_TIMELINE_CONTEXT_IMAGES: "0"
      GRAPHLEC_VLM_TIMEOUT_SEC: "300"
      GRAPHLEC_VLM_NUM_PREDICT: "512"
      GRAPHLEC_VLM_IMAGE_WIDTH: "768"
      # P2A base slide t1/t1_structure — 속도보다 정확도 우선이라 로컬 모델 중
      # qwen3-vl:30b 사용. gpt-5.4-mini로 되돌리려면 provider만 openai로 바꾸면 됨.
      GRAPHLEC_SLIDE_TEXTUALIZER_PROVIDER: "${VLVERIFIER_TEXTUALIZER_PROVIDER:-ollama}"
      GRAPHLEC_SLIDE_TEXTUALIZER_MODEL: "${VLVERIFIER_TEXTUALIZER_MODEL:-qwen3-vl:30b}"
      GRAPHLEC_SLIDE_TEXTUALIZER_WORKERS: "12"
      GRAPHLEC_TEXT_PROCESSOR_PASS1_MODEL: "${GRAPHLEC_TEXT_PROCESSOR_PASS1_MODEL:-ollama:qwen3.8:27b-q4_K_M}"
      GRAPHLEC_TEXT_PROCESSOR_PASS2_MODEL: "${GRAPHLEC_TEXT_PROCESSOR_PASS2_MODEL:-ollama:qwen3.8:27b-q4_K_M}"
      GRAPHLEC_TEXT_PROCESSOR_PASS3_MODEL: "${GRAPHLEC_TEXT_PROCESSOR_PASS3_MODEL:-ollama:qwen3.8:27b-q4_K_M}"
      GRAPHLEC_TEXT_PROCESSOR_IMAGE_MODEL: "${GRAPHLEC_TEXT_PROCESSOR_IMAGE_MODEL:-gpt-4.1-mini}"
      GRAPHLEC_CONTEXT_GROUP_MODEL: "${GRAPHLEC_CONTEXT_GROUP_MODEL:-ollama:qwen3.8:27b-q4_K_M}"

      # Verifier concurrency. Each multi-model stage applies this limit per
      # model, while the claim extractor and slide checker use it as their
      # stage worker limit. Host environment values can override the defaults.
      VERIFIER_STAGE_MAX_WORKERS: "${VERIFIER_STAGE_MAX_WORKERS:-12}"
      VERIFIER_CLAIM_EXTRACT_MAX_WORKERS: "${VERIFIER_CLAIM_EXTRACT_MAX_WORKERS:-20}"
      ISSUE_JUDGE_MAX_WORKERS: "${ISSUE_JUDGE_MAX_WORKERS:-20}"
      ISSUE_TYPE_CLASSIFIER_MAX_WORKERS: "${ISSUE_TYPE_CLASSIFIER_MAX_WORKERS:-20}"
      CLASSIFIED_ISSUE_VERIFIER_MAX_WORKERS: "${CLASSIFIED_ISSUE_VERIFIER_MAX_WORKERS:-20}"
      CLASSIFIED_ISSUE_GROUNDING_MAX_WORKERS: "${CLASSIFIED_ISSUE_GROUNDING_MAX_WORKERS:-20}"
      CLASSIFIED_SLIDE_ERROR_MAX_WORKERS: "${CLASSIFIED_SLIDE_ERROR_MAX_WORKERS:-20}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL:-qwen3.8-27b}"
      LOCAL_LLM_ENABLE_THINKING: "${LOCAL_LLM_ENABLE_THINKING:-0}"

      # All verifier models selected in the UI are invoked through LiteLLM.
      LITELLM_ENABLED: "${LITELLM_ENABLED:-1}"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-http://litellm:4000/v1}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}}"
      VLVERIFIER_CREDENTIAL_ENCRYPTION_KEY: "${VLVERIFIER_CREDENTIAL_ENCRYPTION_KEY:-${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}}"

      # Portable default: Docker Desktop on macOS cannot expose VideoToolbox
      # or NVIDIA CUDA to Linux containers.  The GPU override enables CUDA.
      GRAPHLEC_SLIDE_DECODE_BACKEND: auto
      GRAPHLEC_GPU_ONLY: "0"
      # Step 4 duplicate/build comparison crop: remove 5% from each edge.
      GRAPHLEC_CONTENT_CROP_LEFT: "0.05"
      GRAPHLEC_CONTENT_CROP_TOP: "0.05"
      GRAPHLEC_CONTENT_CROP_RIGHT: "0.95"
      GRAPHLEC_CONTENT_CROP_BOTTOM: "0.95"
      GRAPHLEC_CLEAR_RESET_CROP_BOTTOM: "0.90"

      # Ultralytics / matplotlib 경고 방지용
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
      RAPIDOCR_HOME: /models

      # Step 0 sample cache chunk 병렬화
      GRAPHLEC_SAMPLE_CACHE_FPS: "2"
      GRAPHLEC_SAMPLE_CACHE_RESIZE_WIDTH: "768"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASKS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MODEL: "/app/models/yolo26n.pt"
      # Empty prevents a TensorRT engine copied from a Linux host from being
      # selected on a CPU-only machine; Ultralytics loads the .pt model.
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ENGINE: ""
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_BATCH_SIZE: "32"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ENGINE_BATCH_SIZE: "32"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_CONF: "0.70"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MIN_BBOX_HEIGHT_RATIO: "0.08"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MAX_BBOX_ASPECT: "1.50"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_DILATE_PX: "48"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_CENTER_SHIFT_PX: "4"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_AREA_CHANGE_RATIO: "0.08"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FILL_GAP_SEC: "0"
      # Keep only two 1.4GB TensorRT execution contexts resident. Other
      # decode chunks queue their person batches until a slot is available.
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_INTERVAL_SEC: "20"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_MIN_HITS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_CONF: "0.45"
      GRAPHLEC_SCENE_BASE_DELAY_SEC: "2.0"
      GRAPHLEC_SCENE_BASE_MAX_PENDING_SEC: "5.0"
      # Remove slides that appear for at most three seconds. The remaining
      # timeline is compacted before OCR/VLM so an A -> transient -> A return
      # is evaluated as one continuous slide.
      GRAPHLEC_MIN_SLIDE_DURATION_SEC: "3.0"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_WIDTH: "384"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_WORKERS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_TASK_SEC: "480"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_TASK_OVERLAP_SEC: "5"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_QUANTILE: "0.95"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_RECENTER_PX: "120"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_MAX_GAP_SEC: "2"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_WORKERS: "4"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_SEC: "240"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_OVERLAP_SEC: "5"
      GRAPHLEC_SAMPLE_CACHE_MERGE_WORKERS: "4"
      GRAPHLEC_SAMPLE_CACHE_MERGE_MASK_WORKERS: "4"

      # Step 1 timeline region 병렬화
      GRAPHLEC_REGION_WORKERS: "4"
      GRAPHLEC_REGION_CHUNK_SAMPLES: "2000"
      GRAPHLEC_REGION_GUARD_SAMPLES: "1"

      # Step 2 scene/base probe 병렬화
      GRAPHLEC_SCENE_PROBE_WORKERS: "4"
      GRAPHLEC_SCENE_PROBE_CHUNK_SAMPLES: "2000"
      GRAPHLEC_SCENE_PROBE_GUARD_SAMPLES: "100"
      GRAPHLEC_SCENE_PROBE_KEEP_PARTS: "0"

      # Step 4 duplicates 병렬화
      GRAPHLEC_DUPLICATE_PARALLEL: "1"
      GRAPHLEC_DUPLICATE_WORKERS: "4"
      GRAPHLEC_DUPLICATE_LOG_PAIRS: "0"

    volumes:
      - ./storage:/app/storage
      - ./input:/app/input
      - rapid_ocr_models:/models

    ports:
      - "8003:8000"

    depends_on:
      db:
        condition: service_healthy

  # 정적 빌드된 SPA를 nginx로 서빙하고 /api·/files 를 backend로 프록시한다.
  # 개발 중 코드 즉시 반영이 필요하면 docker-compose.dev.yml 을 함께 사용한다.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  ocr:
    profiles:
      - ocr
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      LOCAL_STORAGE_DIR: /app/storage
      GRAPHLEC_SLIDE_OCR_LANG: multilingual
      GRAPHLEC_SLIDE_OCR_MODEL_DIR: ""
      GRAPHLEC_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.92"
    volumes:
      - ./storage:/app/storage
    ports:
      - "8010:8000"

  ollama:
    profiles:
      - vlm
    image: ollama/ollama:latest
    container_name: vlverifier-ollama
    environment:
      # 모델 기본 컨텍스트(Qwen3 계열은 262144)로 그대로 로드하면 KV 캐시만으로
      # GPU를 다 채워 연산이 CPU로 밀려난다 — 실제로 겪은 문제라 명시적으로 낮춘다.
      OLLAMA_CONTEXT_LENGTH: "${VLVERIFIER_OLLAMA_CONTEXT_LENGTH:-16384}"
      OLLAMA_NUM_PARALLEL: "${VLVERIFIER_OLLAMA_NUM_PARALLEL:-4}"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # OpenAI-compatible gateway. It uses a separate logical database inside the
  # existing PostgreSQL container, so the gateway schema cannot touch the
  # application's `verilec` database.
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.98.0
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-vlverifier-local-dev}"
      # LiteLLM uses DATABASE_URL for its proxy-management database.
      # Reuse the existing PostgreSQL service used by the backend.
      DATABASE_URL: "${LITELLM_DATABASE_URL:-postgresql://user:pass@db/litellm}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      GOOGLE_API_KEY_1: "${GOOGLE_API_KEY_1:-${GOOGLE_API_KEY:-}}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-${VLLM_API_KEY:-local}}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL:-${VLLM_BASE_URL:-}}"
      VLLM_API_KEY: "${VLLM_API_KEY:-local}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-}"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  ollama:
  postgres_data:
  rapid_ocr_models:
