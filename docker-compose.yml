services:
  db:
    image: postgres:16
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      POSTGRES_DB: verilec
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      # LocalVLM / OpenAI-compatible DiffusionGemma

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d verilec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 2 GiB works with Docker Desktop and small machines.  Large Linux hosts
    # can raise this through VERILEC_SHM_SIZE or the GPU override.
    shm_size: "${VERILEC_SHM_SIZE:-2g}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db/verilec
      LOCAL_STORAGE_DIR: /app/storage
      PIPELINE_ROOT: /app
      # Portable default: CPU RapidOCR. The NVIDIA override switches this to
      # Nemotron OCR v2 without changing the pipeline's HTTP OCR contract.
      GRAPHLEC_SLIDE_OCR_PROVIDER: http
      GRAPHLEC_SLIDE_OCR_BASE_URL: http://127.0.0.1:8000
      GRAPHLEC_SLIDE_OCR_LANG: korean
      GRAPHLEC_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.83"
      GRAPHLEC_SLIDE_OCR_ADJACENT_SIMILARITY_THRESHOLD: "0.83"
      # LocalVLM / OpenAI
      GRAPHLEC_VLM_ENABLED: "1"
      GRAPHLEC_VLM_APPLY: "1"
      GRAPHLEC_VLM_PROVIDER: "openai"
      GRAPHLEC_OPENAI_BASE_URL: "https://api.openai.com/v1"
      GRAPHLEC_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GRAPHLEC_OPENAI_MODEL: "gpt-5.6-luna"
      GRAPHLEC_VLM_WORKERS: "15"
      GRAPHLEC_VLM_BATCH_IMAGES: "2"
      GRAPHLEC_VLM_BATCH_CANDIDATES: "1"
      GRAPHLEC_VLM_TIMELINE_CONTEXT_IMAGES: "0"
      GRAPHLEC_VLM_TIMEOUT_SEC: "300"
      GRAPHLEC_VLM_NUM_PREDICT: "512"
      GRAPHLEC_VLM_IMAGE_WIDTH: "768"
      # P2A base slide t1/t1_structure OpenAI requests
      GRAPHLEC_SLIDE_TEXTUALIZER_PROVIDER: "openai"
      GRAPHLEC_SLIDE_TEXTUALIZER_MODEL: "gpt-5.4-mini"
      GRAPHLEC_SLIDE_TEXTUALIZER_WORKERS: "15"

      # Verifier LLM routing and ensemble settings.
      # These values intentionally live in Compose so Docker runs can be
      # changed without editing the host .env file. Edit this block, then
      # recreate the backend container for the changes to take effect.
      ISSUE_JUDGE_MODELS: "gpt-5.4,claude-sonnet-4.5"
      VERIFIER_MAX_WORKERS: "12"
      ISSUE_JUDGE_MAX_WORKERS: "12"
      VERIFIER_ISSUE_JUDGE_BATCH_MAX_WORKERS: "12"
      VERIFIER_ISSUE_DETECTOR_BATCH_SIZE: "4"
      VERIFIER_ISSUE_JUDGE_MIN_CONFIDENCE: "0.8"
      VERIFIER_ISSUE_JUDGE_DISAGREEMENT_REJECT_DELTA: "0.40"
      VERIFIER_ISSUE_JUDGE_DISAGREEMENT_KEEP_CONFIDENCE: "0.90"

      # Claim extraction / claim judge / slide-error verifier.
      VERIFIER_MODEL: "gemini-2.5-flash"
      VERIFIER_CLAIM_EXTRACT_MODEL: "gpt-5.6-terra"
      VERIFIER_CLAIM_JUDGE_MODEL: "gemini-2.5-flash"
      VERIFIER_SLIDE_ERROR_MODEL: "gemini-2.5-flash"
      VERIFIER_TEMPERATURE: "0.0"
      VERIFIER_BATCH_SIZE: "15"
      VERIFIER_CLAIM_EXTRACT_BATCH_SIZE: "2"
      VERIFIER_CLAIM_EXTRACT_MAX_WORKERS: "12"
      VERIFIER_CLAIM_EXTRACT_CONTEXT_MODE: "cards"
      VERIFIER_CLAIM_EXTRACT_BATCH_MODE: "context"
      VERIFIER_CLAIM_EXTRACT_CONTEXT_PREV: "1"
      VERIFIER_CLAIM_EXTRACT_CONTEXT_NEXT: "1"
      VERIFIER_CLAIM_EXTRACT_CONTEXT_GROUP_SIZE: "3"
      VERIFIER_CLAIM_EXTRACT_PROMPT_PROFILE: "auto"
      VERIFIER_PARSE_RETRIES: "2"
      VERIFIER_BATCH_RECOVERY_RETRIES: "1"
      VERIFIER_REQUIRE_COMPLETE: "1"

      # Issue-type classifier models, aliases, weights and request settings.
      ISSUE_TYPE_CLASSIFIER_MODELS: "gpt,claude,grok"
      ISSUE_TYPE_CLASSIFIER_MODEL_WEIGHTS: "gpt=0.4,claude=0.4,grok=0.2"
      ISSUE_TYPE_CLASSIFIER_GPT_MODEL: "gpt-5.4"
      ISSUE_TYPE_CLASSIFIER_CLAUDE_MODEL: "claude-sonnet-4.5"
      ISSUE_TYPE_CLASSIFIER_GROK_MODEL: "grok-4"
      ISSUE_TYPE_CLASSIFIER_DEEPSEEK_MODEL: "deepseek-v4-flash"
      ISSUE_TYPE_CLASSIFIER_GEMINI_MODEL: "gemini-2.5-flash"
      ISSUE_TYPE_CLASSIFIER_BATCH_SIZE: "10"
      ISSUE_TYPE_CLASSIFIER_MAX_WORKERS: "12"
      ISSUE_TYPE_CLASSIFIER_MAX_TOKENS: "8192"
      ISSUE_TYPE_CLASSIFIER_CURRENT_DATE: "2026-07-16"
      ISSUE_TYPE_CLASSIFIER_LOW_MARGIN_THRESHOLD: "0.10"
      ISSUE_TYPE_CLASSIFIER_API_RETRIES: "2"
      ISSUE_TYPE_CLASSIFIER_API_RETRY_WAIT_SEC: "10"
      ISSUE_TYPE_CLASSIFIER_BATCH_RETRIES: "2"
      ISSUE_TYPE_CLASSIFIER_BATCH_RETRY_WAIT_SEC: "10"
      ISSUE_TYPE_CLASSIFIER_GROK_RETRY_WAIT_SEC: "60"
      ISSUE_TYPE_CLASSIFIER_DEEPSEEK_THINKING: "disabled"
      ISSUE_TYPE_CLASSIFIER_GEMINI_THINKING_BUDGET: ""
      ISSUE_TYPE_CLASSIFIER_SEED: ""

      # Classified issue verifier ensemble.
      CLASSIFIED_ISSUE_VERIFIER_MODELS: "gpt,claude,grok"
      CLASSIFIED_ISSUE_VERIFIER_MODEL_WEIGHTS: "gpt=0.4,claude=0.4,grok=0.2"
      CLASSIFIED_ISSUE_VERIFIER_BATCH_SIZE: "5"
      CLASSIFIED_ISSUE_VERIFIER_MAX_WORKERS: "12"
      CLASSIFIED_ISSUE_VERIFIER_MAX_TOKENS: "8192"
      CLASSIFIED_ISSUE_VERIFIER_CONTEXT_WINDOW: "5"
      CLASSIFIED_ISSUE_VERIFIER_CURRENT_DATE: "2026-07-16"
      CLASSIFIED_ISSUE_VERIFIER_CONFIRMED_THRESHOLD: "0.80"
      CLASSIFIED_ISSUE_VERIFIER_REJECTED_THRESHOLD: "0.20"
      CLASSIFIED_ISSUE_PIPELINE_MAX_TOKENS: "8192"

      # Classified slide-error and web-grounding calls.
      CLASSIFIED_SLIDE_ERROR_MODELS: "gpt"
      CLASSIFIED_SLIDE_ERROR_BATCH_SIZE: "5"
      CLASSIFIED_SLIDE_ERROR_MAX_WORKERS: "12"
      CLASSIFIED_SLIDE_ERROR_MAX_TOKENS: "4096"
      CLASSIFIED_ISSUE_GROUNDING_ENABLED: "1"
      CLASSIFIED_ISSUE_GROUNDING_MODEL: "gemini-2.5-flash"
      CLASSIFIED_ISSUE_GROUNDING_MAX_WORKERS: "1"
      CLASSIFIED_ISSUE_GROUNDING_MAX_TOKENS: "2048"
      CLASSIFIED_ISSUE_GROUNDING_CURRENT_DATE: "2026-07-16"

      # Provider-specific retry/cache controls used by verifier workers.
      VERIFIER_DEEPSEEK_THINKING: "disabled"
      VERIFIER_DEEPSEEK_REASONING_EFFORT: ""
      VERIFIER_DEEPSEEK_TIMEOUT_SEC: "180"
      VERIFIER_DEEPSEEK_API_MAX_RETRIES: "4"
      VERIFIER_DEEPSEEK_API_INITIAL_WAIT: "5"
      VERIFIER_OPENAI_PROMPT_CACHE_KEY: ""
      VERIFIER_OPENAI_PROMPT_CACHE_RETENTION: ""
      VERIFIER_ANTHROPIC_PROMPT_CACHE: ""
      VERIFIER_ANTHROPIC_PROMPT_CACHE_TTL: ""

      # Portable default: Docker Desktop on macOS cannot expose VideoToolbox
      # or NVIDIA CUDA to Linux containers.  The GPU override enables CUDA.
      GRAPHLEC_SLIDE_DECODE_BACKEND: auto
      GRAPHLEC_GPU_ONLY: "0"
      # Step 4 duplicate/build comparison crop: remove 5% from each edge.
      GRAPHLEC_CONTENT_CROP_LEFT: "0.05"
      GRAPHLEC_CONTENT_CROP_TOP: "0.05"
      GRAPHLEC_CONTENT_CROP_RIGHT: "0.95"
      GRAPHLEC_CONTENT_CROP_BOTTOM: "0.95"
      GRAPHLEC_CLEAR_RESET_CROP_BOTTOM: "0.90"

      # Ultralytics / matplotlib 경고 방지용
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
      RAPIDOCR_HOME: /models

      # Step 0 sample cache chunk 병렬화
      GRAPHLEC_SAMPLE_CACHE_FPS: "2"
      GRAPHLEC_SAMPLE_CACHE_RESIZE_WIDTH: "768"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASKS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MODEL: "/app/models/yolo26n.pt"
      # Empty prevents a TensorRT engine copied from a Linux host from being
      # selected on a CPU-only machine; Ultralytics loads the .pt model.
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ENGINE: ""
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_BATCH_SIZE: "32"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ENGINE_BATCH_SIZE: "32"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_CONF: "0.70"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MIN_BBOX_HEIGHT_RATIO: "0.08"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_MAX_BBOX_ASPECT: "1.50"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_DILATE_PX: "48"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_CENTER_SHIFT_PX: "12"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FIXED_MIN_AREA_CHANGE_RATIO: "0.12"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_FILL_GAP_SEC: "0"
      # Keep only two 1.4GB TensorRT execution contexts resident. Other
      # decode chunks queue their person batches until a slot is available.
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_INTERVAL_SEC: "20"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_MIN_HITS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_CONF: "0.45"
      GRAPHLEC_SCENE_BASE_DELAY_SEC: "2.0"
      GRAPHLEC_SCENE_BASE_MAX_PENDING_SEC: "5.0"
      # Remove slides that appear for at most three seconds. The remaining
      # timeline is compacted before OCR/VLM so an A -> transient -> A return
      # is evaluated as one continuous slide.
      GRAPHLEC_MIN_SLIDE_DURATION_SEC: "3.0"
      GRAPHLEC_SAMPLE_CACHE_PERSON_GATE_WIDTH: "384"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_WORKERS: "1"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_TASK_SEC: "480"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_TASK_OVERLAP_SEC: "5"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_QUANTILE: "0.95"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_RECENTER_PX: "120"
      GRAPHLEC_SAMPLE_CACHE_PERSON_MASK_ROI_MAX_GAP_SEC: "2"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_WORKERS: "4"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_SEC: "240"
      GRAPHLEC_SAMPLE_CACHE_CHUNK_OVERLAP_SEC: "5"
      GRAPHLEC_SAMPLE_CACHE_STREAM_COPY_CORE: "1"
      GRAPHLEC_SAMPLE_CACHE_MERGE_WORKERS: "4"
      GRAPHLEC_SAMPLE_CACHE_MERGE_MASK_WORKERS: "4"

      # Step 1 timeline region 병렬화
      GRAPHLEC_REGION_WORKERS: "4"
      GRAPHLEC_REGION_CHUNK_SAMPLES: "2000"
      GRAPHLEC_REGION_GUARD_SAMPLES: "1"

      # Step 2 scene/base probe 병렬화
      GRAPHLEC_SCENE_PROBE_WORKERS: "4"
      GRAPHLEC_SCENE_PROBE_CHUNK_SAMPLES: "2000"
      GRAPHLEC_SCENE_PROBE_GUARD_SAMPLES: "100"
      GRAPHLEC_SCENE_PROBE_KEEP_PARTS: "0"

      # Step 4 duplicates 병렬화
      GRAPHLEC_DUPLICATE_PARALLEL: "1"
      GRAPHLEC_DUPLICATE_WORKERS: "4"
      GRAPHLEC_DUPLICATE_LOG_PAIRS: "0"

    volumes:
      - ./storage:/app/storage
      - ./input:/app/input
      - rapid_ocr_models:/models

    ports:
      - "8003:8000"

    depends_on:
      db:
        condition: service_healthy

  ocr:
    profiles:
      - ocr
    build:
      context: .
      dockerfile: ocr_service/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      LOCAL_STORAGE_DIR: /app/storage
      GRAPHLEC_SLIDE_OCR_LANG: multilingual
      GRAPHLEC_SLIDE_OCR_MODEL_DIR: ""
      GRAPHLEC_SLIDE_OCR_SIMILARITY_THRESHOLD: "0.92"
    volumes:
      - ./storage:/app/storage
    ports:
      - "8010:8000"

  ollama:
    profiles:
      - vlm
    image: ollama/ollama:latest
    container_name: verilec-ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
volumes:
  ollama:
  postgres_data:
  rapid_ocr_models:
